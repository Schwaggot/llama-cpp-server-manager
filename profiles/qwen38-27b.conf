# Qwen3.8 27B (Unsloth UD-Q4_K_XL) - 27B dense, multimodal
# Docs: https://unsloth.ai/docs/models/qwen3.8
#
# Dense 27B successor to Qwen3.6-27B. Vision-capable, with graded reasoning
# instead of the old on/off thinking toggle: the chat template takes
# reasoning_effort = xhigh (default) | medium | low | none.
#
# Best for: translation, summarization, rewriting, creative writing,
# multi-turn dialogue, agentic coding, tool calling.
#
# Reasoning is off here for text work; raise reasoning_effort in EXTRA_FLAGS
# (or add a separate profile) for coding and analysis.

MODEL_NAME="Qwen3.8-27B"
MODEL_PATH="/var/lib/llama-cpp/models/Qwen3.8-27B-UD-Q4_K_XL.gguf"

# Vision projector (multimodal support)
MMPROJ_PATH="/var/lib/llama-cpp/models/Qwen3.8-27B-mmproj-BF16.gguf"

HOST="0.0.0.0"
PORT="8090"

GPU_LAYERS="auto"
CTX_SIZE="262144"
BATCH_SIZE="8192"
UBATCH_SIZE="4096"
FLASH_ATTN="on"
THREADS="16"
PARALLEL="2"

# KV cache quantization
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"

# Sampling defaults (Unsloth instruct preset for Qwen3.8)
TEMP="0.7"
TOP_P="0.8"
MIN_P="0.0"
TOP_K="20"
REPEAT_PENALTY="1.0"

# Extra flags - reasoning off for translation/summarization work.
# presence-penalty 1.5 is Unsloth's recommendation for the instruct preset.
EXTRA_FLAGS="--jinja --presence-penalty 1.5 --chat-template-kwargs '{\"reasoning_effort\":\"none\"}'"
