# Nemotron 3.5 Lightning 30B-A3B (Unsloth UD-Q4_K_XL) - MTP variant
# Docs: https://unsloth.ai/docs/models/nemotron-3.5
#
# Same GGUF as nemotron35-lightning-30b-a3b: the Multi-Token Prediction head
# ships inside it (tensors blk.52.nextn.*), so there is nothing extra to
# download and no separate draft file - only --spec-type draft-mtp.
#
# Thinking stays off here; MTP pays off most on the high-volume agent work
# this model targets. Flip the chat-template kwarg to combine it with
# reasoning.
#
# REQUIRES a llama-server build that supports MTP speculative decoding.
# Verify with:  llama-server --help | grep -- --spec-type

MODEL_NAME="Nemotron-3.5-Lightning-30B-A3B-MTP"
MODEL_PATH="/var/lib/llama-cpp/models/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-UD-Q4_K_XL.gguf"

# MTP head is embedded in the model above - no separate draft file.
MODEL_DRAFT_PATH=""

# No vision
MMPROJ_PATH=""

HOST="0.0.0.0"
PORT="8090"

GPU_LAYERS="auto"
# The GGUF advertises 1M; NVIDIA serves 256K on a single 80 GB card.
CTX_SIZE="262144"
BATCH_SIZE="8192"
UBATCH_SIZE="4096"
FLASH_ATTN="on"
THREADS="16"
# Speculative decoding is single-stream oriented; keep parallel at 1.
PARALLEL="1"

# KV cache quantization
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"

# Sampling defaults (Unsloth instruct preset). NVIDIA's model card instead
# recommends temp 1.0 / top_p 0.95 for both modes.
TEMP="0.2"
TOP_P="0.95"
MIN_P="0.01"
TOP_K="0"
REPEAT_PENALTY="1.0"

# Extra flags - thinking disabled, plus MTP speculative decoding.
# --spec-draft-n-max: tokens drafted per step (start at 2; test 1-6).
EXTRA_FLAGS="--jinja --chat-template-kwargs '{\"enable_thinking\":false}' --spec-type draft-mtp --spec-draft-n-max 2"
