# Qwen3.8 27B (Unsloth UD-Q4_K_XL) - vision + reasoning + MTP
# Docs: https://unsloth.ai/docs/models/qwen3.8
#
# Everything the 27B has, in one profile: the vision projector, graded
# reasoning at medium effort, and MTP speculative decoding. Same GGUF as every
# other qwen38 profile - the MTP head ships inside it (block 64, tensors
# blk.64.nextn.*), so only the mmproj is an extra file.
#
# The sibling -mtp profiles say vision cannot run alongside MTP. That was true
# of older llama.cpp; on b9856 the mmproj and the MTP draft context are built
# independently and neither excludes the other.
#
# Measured on b9856: draft acceptance 0.93 (mean len 2.87) on a text turn and
# 0.82 (2.64) on an image turn, against 0.80-0.87 for qwen38-27b-think-mtp.
# The draft context is primed from text tokens only, so image turns give up a
# little acceptance, but MTP still pays.
#
# --mmproj disables context shift and cache reuse; at 256K that rarely bites,
# but a session past the window ends rather than sliding.
#
# --image-min-tokens 1024 follows llama.cpp's own startup warning for Qwen-VL:
# below that, grounding tasks lose accuracy. Drop it to trade accuracy for
# fewer prompt tokens per image.
#
# REQUIRES a llama-server build that supports MTP speculative decoding.
# Verify with:  llama-server --help | grep -- --spec-type

MODEL_NAME="Qwen3.8-27B-vision-think-MTP"
MODEL_PATH="/var/lib/llama-cpp/models/Qwen3.8-27B-UD-Q4_K_XL.gguf"

# MTP head is embedded in the model above - no separate draft file.
MODEL_DRAFT_PATH=""

# Vision projector (multimodal support)
MMPROJ_PATH="/var/lib/llama-cpp/models/Qwen3.8-27B-mmproj-BF16.gguf"

HOST="0.0.0.0"
PORT="8090"

GPU_LAYERS="auto"
CTX_SIZE="262144"
BATCH_SIZE="8192"
UBATCH_SIZE="4096"
FLASH_ATTN="on"
THREADS="16"
# Speculative decoding is single-stream oriented; keep parallel at 1.
PARALLEL="1"

# KV cache quantization
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"

# Sampling defaults (Unsloth thinking preset for Qwen3.8)
TEMP="1.0"
TOP_P="0.95"
MIN_P="0.0"
TOP_K="20"
REPEAT_PENALTY="1.0"

# Extra flags - reasoning on at medium effort, traces in deepseek format,
# plus MTP speculative decoding.
# --spec-draft-n-max: tokens drafted per step (start at 2; test 1-6).
EXTRA_FLAGS="--jinja --reasoning-format deepseek --reasoning on --chat-template-kwargs '{\"reasoning_effort\":\"medium\"}' --spec-type draft-mtp --spec-draft-n-max 2 --image-min-tokens 1024"
