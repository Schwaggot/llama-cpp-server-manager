# GLM-5.3-Flash (Unsloth UD-Q2_K_XL) - agentic coding, max reasoning
# Docs: https://unsloth.ai/docs/models/glm-5.3-flash
#
# Same weights as glm-5.3-flash, with Z.ai's DeepSWE preset (temp 0.95,
# top_p 1.0) and reasoning_effort at max - the level Unsloth name for hard
# tasks, and the default the template falls back to.
#
# This is what the model is pitched at: Terminal Bench 2.1 84.3 and DeepSWE
# v1.1 63.4, both ahead of GLM-5.2. Note those are the BF16 numbers; this
# profile serves a 2-bit quant that keeps 78% top-1, so expect a gap.
#
# The template keeps earlier reasoning blocks in the history, which preserves
# an agent's decision trace across tool calls at the cost of context. Add
# '{"clear_thinking":true}' alongside reasoning_effort to drop them.
#
# Tool calls use GLM's own <tool_call><arg_key>... XML, so --jinja is not
# optional here.
#
# REQUIRES a llama-server built from Unsloth's glm5next/upstream branch - see
# glm-5.3-flash for the build and the verification command.

MODEL_NAME="GLM-5.3-Flash-code"
# GGUF is split into 4 parts - point MODEL_PATH to part 1.
MODEL_PATH="/var/lib/llama-cpp/models/GLM-5.3-Flash-UD-Q2_K_XL-00001-of-00004.gguf"

# The MTP head ships inside the main GGUF - no separate draft file.
MODEL_DRAFT_PATH=""

# No vision in this profile
MMPROJ_PATH=""

HOST="0.0.0.0"
PORT="8090"

# Explicit, not "auto" - see glm-5.3-flash for the reasoning behind these.
GPU_LAYERS="99"
CTX_SIZE="262144"
BATCH_SIZE="2048"
UBATCH_SIZE="512"
FLASH_ATTN="on"
THREADS="16"
# Speculative decoding is single-stream oriented; keep parallel at 1.
PARALLEL="1"

# KV cache unquantized - only 11 of 45 layers hold one. Worth keeping f16
# here: max-effort traces plus preserved thinking make this the profile that
# fills the window.
CACHE_TYPE_K="f16"
CACHE_TYPE_V="f16"

# Sampling (Z.ai DeepSWE preset). top_p 1.0 means no nucleus truncation, so
# temperature alone shapes the distribution.
TEMP="0.95"
TOP_P="1.0"
MIN_P="0.0"
TOP_K="0"
REPEAT_PENALTY="1.0"

# Extra flags - reasoning at max effort, traces in deepseek format so a client
# can render them apart from the answer and from tool calls.
# MTP matters most here: agentic turns are long and single-stream. Sweep
# --spec-draft-n-max 2 and 3 against your own workload.
EXTRA_FLAGS="--jinja --reasoning-format deepseek --reasoning on --chat-template-kwargs '{\"reasoning_effort\":\"max\"}' --spec-type draft-mtp --spec-draft-n-max 2 -cmoe -fit off"
