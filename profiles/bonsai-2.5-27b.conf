# Ternary Bonsai 2.5 27B (PrismML Q2_0 + MTP head) - agentic, vision, reasoning
# Docs: https://huggingface.co/prism-ml/Ternary-Bonsai-2.5-27B-GGUF
#
# Successor to bonsai-2-27b: same ternary format and Qwen3.8-27B base (GGUF
# arch qwen35), retrained for tool calling and agentic coding. The -mtp file
# is the plain Q2_0 model plus PrismML's MTP draft head (+240 MB).
#
# Q2_0 runs on stock llama.cpp b11556 or newer; older builds load it silently
# and emit garbage. PTQ1_0 and PQ2_0 need PrismML's fork.
#
# reasoning_effort takes xhigh (template default) or medium; "low" behaves
# like xhigh. Unlike Bonsai 2, "none" raises HTTP 500: disable thinking per
# request with chat_template_kwargs {"enable_thinking": false} instead.
#
# MTP on halo (Vulkan, b12810): 23.6 -> 55 tok/s decode at 3 drafts. A fourth
# draft adds only ~5% at temp 0, and PrismML found it slower on NVIDIA.

MODEL_NAME="Ternary-Bonsai-2.5-27B"
MODEL_PATH="/var/lib/llama-cpp/models/Ternary-Bonsai-2.5-27B-Q2_0-mtp.gguf"
MMPROJ_PATH="/var/lib/llama-cpp/models/Ternary-Bonsai-2.5-27B-mmproj-Q8_0.gguf"

HOST="0.0.0.0"
PORT="8090"

GPU_LAYERS="99"
CTX_SIZE="262144"
BATCH_SIZE="2048"
UBATCH_SIZE="1024"
FLASH_ATTN="on"
THREADS="16"
PARALLEL="1"
REQUIRE_GPU="yes"

CACHE_TYPE_K="q8_0"
CACHE_TYPE_V="q8_0"

# Thinking preset from the model card; min_p 0 overrides llama.cpp's 0.05.
TEMP="1.0"
TOP_P="0.95"
MIN_P="0.0"
TOP_K="20"
REPEAT_PENALTY="1.0"

EXTRA_FLAGS="-fit off --jinja --reasoning-format deepseek --chat-template-kwargs '{\"reasoning_effort\":\"medium\"}' --image-min-tokens 1024 --spec-type draft-mtp --spec-draft-n-min 0 --spec-draft-n-max 3 --spec-draft-p-min 0.1"
