# GLM-5.3-Flash (Unsloth UD-Q2_K_XL) - 320B MoE, 18B active, multimodal
# Docs: https://unsloth.ai/docs/models/glm-5.3-flash
#
# Sized for the 128 GB Strix Halo box (125 GB usable, Vulkan iGPU). Memory is
# the binding constraint: Unsloth put 3-bit UD-IQ3_XXS at 120 GB and ask for
# 128-150 GB, which leaves nothing for the KV cache and compute buffers here.
# UD-Q2_K_XL is 108.7 GB and keeps 78% top-1; step down to UD-IQ2_XXS
# (101.8 GB, 76%) if this still runs tight, or up to UD-IQ3_XXS (82%) on a
# larger host.
#
# Architecture (llama.cpp PR #27773): 34 KDA linear-attention layers plus 11
# nope-only MLA layers with DeepSeek-style sparse attention and mHC. Only those
# 11 layers hold a KV cache, which is what makes 256K context affordable at
# this model size.
#
# There is no non-thinking sibling: the chat template has no enable_thinking
# variable and always opens a <think> block, so reasoning_effort is the only
# lever. low lives in glm-5.3-flash-low, max in glm-5.3-flash-code.
#
# REQUIRES a llama-server built from Unsloth's branch - glm5next is not in
# upstream master (PRs #27752, #27754, #27773 all still open on 2026-09-21):
#   git clone --branch glm5next/upstream https://github.com/unslothai/llama.cpp
# That branch also carries the GLM MTP head (PR #27917) and Vulkan sparse
# flash attention (#28105), both of which this profile relies on.
# Verify against the library, not the binary: a shared build leaves only a thin
# shim in /usr/local/bin, so the arch table is in libllama.so.
#   strings /usr/local/lib/libllama.so.0 /usr/local/bin/llama-server \
#     2>/dev/null | grep -c glm5next

MODEL_NAME="GLM-5.3-Flash"
# GGUF is split into 4 parts - point MODEL_PATH to part 1.
MODEL_PATH="/var/lib/llama-cpp/models/GLM-5.3-Flash-UD-Q2_K_XL-00001-of-00004.gguf"

# The MTP head ships inside the main GGUF - no separate draft file.
MODEL_DRAFT_PATH=""

# Vision is supported (glm5v tower, mmproj-BF16.gguf upstream) but left off:
# at 109 GB the projector and the loss of context shift are not worth it here.
MMPROJ_PATH=""

HOST="0.0.0.0"
PORT="8090"

# Explicit, not "auto": at 109 GB the model cannot fit the 105.5 GiB GTT pool,
# so -cmoe in EXTRA_FLAGS decides what stays on the host and -fit off keeps the
# sizer from second-guessing it.
GPU_LAYERS="99"
CTX_SIZE="262144"
# Deliberately small. Upstream reports a prefill crash at -ub 2048 on this
# architecture (issue #28282, CUDA/sm_120, -ub 512 is the workaround), and
# small batches also keep the compute buffers off an already full memory pool.
BATCH_SIZE="2048"
UBATCH_SIZE="512"
# On: the 11 sparse-attention layers want it, and the branch has the Vulkan
# sparse FA path. PR #27754 reports its MLA needing -fa off because the F32
# latent is cast to F16 - if output comes out garbled, try that first.
FLASH_ATTN="on"
THREADS="16"
# Multiple sequences need --kv-unified on this architecture; one avoids that.
PARALLEL="1"

# KV cache unquantized: only 11 of 45 layers hold one, and it is a compressed
# MLA latent, so f16 is cheap here. Upstream calls the KV type a free choice
# for this architecture (#27754), and quantizing over MLA is the riskier path.
CACHE_TYPE_K="f16"
CACHE_TYPE_V="f16"

# Sampling defaults (Unsloth preset for GLM-5.3-Flash). The card gives only
# temperature and top_p, so the other samplers are switched off rather than
# left at llama.cpp's defaults. For DeepSWE-style agentic coding, Z.ai suggest
# temp 0.95 / top_p 1.0 instead.
TEMP="1.0"
TOP_P="0.95"
MIN_P="0.0"
TOP_K="0"
REPEAT_PENALTY="1.0"

# Extra flags.
# The chat template always opens a <think> block, so there is no non-thinking
# mode - only reasoning_effort low | high | max (max is the default and what
# anything unrecognized falls back to). high is the balance point; raise it to
# max for hard tasks, drop to low when decode speed matters more; both have
# their own profile.
# --spec-type draft-mtp uses the model's own NextN head. Unsloth measured n=2
# as the peak on a B200 (86.5 vs 58.6 tok/s at 4K) and n=3 and n=5 slower, but
# PR #27917 got its 15-30% on a heavily offloaded box at n=3 - sweep both here.
# -cmoe keeps the experts in host memory - on unified memory that is about
# staying inside the GTT allocation, not crossing a bus. Trade host RAM for
# speed with -ncmoe N to pull the first N layers' experts back onto the GPU.
# The template also takes '{"clear_thinking":true}' to drop earlier reasoning
# blocks from the history; it keeps them by default.
EXTRA_FLAGS="--jinja --reasoning-format deepseek --reasoning on --chat-template-kwargs '{\"reasoning_effort\":\"high\"}' --spec-type draft-mtp --spec-draft-n-max 2 -cmoe -fit off"
