# GLM-5.3-Flash (Unsloth UD-IQ3_XXS) - 320B MoE, 18B active, multimodal
# Docs: https://unsloth.ai/docs/models/glm-5.3-flash
#
# Sized for the 128 GB Strix Halo box: 125.1 GiB of RAM, which is 134 GB in
# the decimal units Unsloth quote, and a 122 GiB GTT pool on the Vulkan iGPU.
# That pool is not the default: halo boots with ttm.pages_limit=31981568 and
# ttm.page_pool_size=31981568, raised from the stock 105 GiB, which this model
# does not fit under. UD-IQ3_XXS is 120.4 GB (112 GiB) at 82% top-1 and sits
# inside the 128-150 GB they ask for. Step down to UD-Q2_K_XL (108.7 GB, 78%)
# if that runs tight.
#
# halo is tuned for this model and the settings are not defaults. Kernel
# command line carries amd_iommu=off alongside the ttm parameters; the box
# boots to multi-user.target, not graphical, because RAM is the binding
# constraint; and gpu-perf-high.service pins the iGPU to its top power level
# (+4.4% decode, +3.2% prefill, measured). Undo any of these and re-sweep.
#
# Architecture (llama.cpp PR #27773): 34 KDA linear-attention layers plus 11
# nope-only MLA layers with DeepSeek-style sparse attention and mHC. Only those
# 11 layers hold a KV cache, which is what makes 256K context affordable at
# this model size.
#
# There is no non-thinking sibling: the chat template has no enable_thinking
# variable and always opens a <think> block, so reasoning_effort is the only
# lever. low lives in glm-5.3-flash-low, max in glm-5.3-flash-code.
#
# REQUIRES a llama-server built from Unsloth's branch - glm5next is not in
# upstream master (PRs #27752, #27754, #27773 all still open on 2026-09-21):
#   git clone --branch glm5next/upstream https://github.com/unslothai/llama.cpp
# That branch also carries the GLM MTP head (PR #27917) and Vulkan sparse
# flash attention (#28105), both of which this profile relies on.
# Verify against the library, not the binary: a shared build leaves only a thin
# shim in /usr/local/bin, so the arch table is in libllama.so.
#   strings /usr/local/lib/libllama.so.0 /usr/local/bin/llama-server \
#     2>/dev/null | grep -c glm5next

MODEL_NAME="GLM-5.3-Flash"
# GGUF is split into 4 parts - point MODEL_PATH to part 1.
MODEL_PATH="/var/lib/llama-cpp/models/GLM-5.3-Flash-UD-IQ3_XXS-00001-of-00004.gguf"

# The MTP head ships inside the main GGUF - no separate draft file.
MODEL_DRAFT_PATH=""

# Vision is supported (glm5v tower, mmproj-BF16.gguf upstream) but left off:
# at 112 GiB the projector and the loss of context shift are not worth it here.
MMPROJ_PATH=""

# Not "auto": at boot the amdgpu DRM node can appear after this service, and
# llama-server then falls back to CPU with only a warning - healthy unit,
# a tenth of the speed. This makes serve.sh wait for the Vulkan device.
REQUIRE_GPU="yes"

HOST="0.0.0.0"
PORT="8090"

# Explicit, not "auto": the weights plus KV and compute buffers do not fit the
# 122 GiB GTT pool, so -ncmoe in EXTRA_FLAGS decides what stays on the host and
# -fit off keeps the sizer from second-guessing it. Every expert on the GPU
# was measured and fails even at 128K/f16.
GPU_LAYERS="99"
# Roughly 5 GiB per 128K tokens at f16, so about 10 GiB here. Larger windows
# cost throughput, because KV and the experts draw on the same pool: 256K runs
# 16.62 tok/s at N=6, 384K about 10.6, and 512K does not fit at f16 at all -
# it needs q8_0, and then only at a much higher N (9.42 tok/s at N=12).
# Context and expert offload trade against each other; re-sweep -ncmoe if you
# change this.
CTX_SIZE="262144"
# Deliberately small. Upstream reports a prefill crash at -ub 2048 on this
# architecture (issue #28282, CUDA/sm_120, -ub 512 is the workaround), and
# small batches also keep the compute buffers off an already full memory pool.
BATCH_SIZE="2048"
UBATCH_SIZE="512"
# On: the 11 sparse-attention layers want it, and the branch has the Vulkan
# sparse FA path. PR #27754 reports its MLA needing -fa off because the F32
# latent is cast to F16 - if output comes out garbled, try that first.
FLASH_ATTN="on"
THREADS="16"
# Multiple sequences need --kv-unified on this architecture; one avoids that.
PARALLEL="1"

# KV cache unquantized: only 11 of 45 layers hold one, and it is a compressed
# MLA latent, so f16 is cheap here. Upstream calls the KV type a free choice
# for this architecture (#27754). q8_0 works on this build, but measured no
# faster than f16 at equal N (15.21 vs 15.34 at N=8, inside run-to-run noise).
# Its only value is freeing GTT so a lower N fits, and at 256K f16 already
# fits at N=6 - so there is no reason to give up cache precision here. At 512K
# it stops being optional.
CACHE_TYPE_K="f16"
CACHE_TYPE_V="f16"

# Sampling defaults (Unsloth preset for GLM-5.3-Flash). The card gives only
# temperature and top_p, so the other samplers are switched off rather than
# left at llama.cpp's defaults. For DeepSWE-style agentic coding, Z.ai suggest
# temp 0.95 / top_p 1.0 instead.
TEMP="1.0"
TOP_P="0.95"
MIN_P="0.0"
TOP_K="0"
REPEAT_PENALTY="1.0"

# --load-mode mmap is NOT optional on this box. Without it llama.cpp pins the
# host-side weights, RADV over-commits the GTT heap, and the first queue submit
# dies with "Not enough memory for command submission" -> device lost. It is a
# size threshold, not an architecture problem: qwen38-flash-next at 104 GiB fit
# under the old 105 GiB GTT budget and this model at 112 GiB did not.
# Upstream: PR #29213 (open) fixes the over-commit, issue #27360 documents this
# same workaround. The kernel-side lever is ttm.pages_limit (amdgpu.gttsize
# exists too, at -1/auto). It is read at driver init, so writing
# /sys/module/ttm/parameters/pages_limit at runtime does nothing - the GTT
# manager keeps its boot-time size and only a reboot moves it.
#
# mmap has a cost llama.cpp warns about: "tensor overrides to CPU are used with
# mmap enabled - consider using --load-mode none". We cannot take that advice;
# none is what triggers the over-commit. So the host-side experts are served
# from page cache, and when GTT crowds the cache out they are re-read per
# token. That is what sets the -ncmoe optimum below.
# Extra flags.
# The chat template always opens a <think> block, so there is no non-thinking
# mode - only reasoning_effort low | high | max (max is the default and what
# anything unrecognized falls back to). high is the balance point; raise it to
# max for hard tasks, drop to low when decode speed matters more; both have
# their own profile.
# --spec-type draft-mtp uses the model's own NextN head. Unsloth measured n=2
# as the peak on a B200 (86.5 vs 58.6 tok/s at 4K) and n=3 and n=5 slower, but
# PR #27917 got its 15-30% on a heavily offloaded box at n=3 - sweep both here.
# -ncmoe N keeps the experts of the first N layers in host memory - on unified
# memory that is about staying inside the GTT allocation, not crossing a bus.
# Measured on halo at 256K/f16, generation in tok/s:
#   N=45 (-cmoe) 7.38 | N=10 14.19 | N=8 15.34 | N=6 16.62 | N=4 17.32
# N=4 is faster still but leaves only ~1.2 GiB under the GTT ceiling, and an
# over-ask does not fail cleanly - it can wedge llama-server in D state inside
# ttm_lru_walk_for_evict, holding its memory until the box is rebooted. N=6
# gives up 4% for five times the headroom, which is the right trade for a
# service meant to stay up. N=2 and below do not load at all.
# The optimum moves with CTX_SIZE, since KV competes for the same pool: at
# 512K it inverts and higher N wins (N=12, 9.42 tok/s). Re-sweep if you change
# the window.
# The template also takes '{"clear_thinking":true}' to drop earlier reasoning
# blocks from the history; it keeps them by default.
EXTRA_FLAGS="--jinja --reasoning-format deepseek --reasoning on --chat-template-kwargs '{\"reasoning_effort\":\"high\"}' --spec-type draft-mtp --spec-draft-n-max 2 -ncmoe 6 -fit off --load-mode mmap"
