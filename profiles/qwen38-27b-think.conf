# Qwen3.8 27B (Unsloth UD-Q4_K_XL) - reasoning enabled
# Docs: https://unsloth.ai/docs/models/qwen3.8
#
# Same weights as qwen38-27b, with reasoning on and Unsloth's thinking preset
# (temp 1.0, top_p 0.95, presence_penalty 0). Traces are exposed in the
# deepseek format so clients can render them separately from the answer.
#
# Qwen3.8 grades reasoning instead of toggling it. reasoning_effort is set to
# medium here, which Unsloth recommends as the accuracy/speed balance for
# coding; raise it to xhigh (the model default) for complex analysis.
#
# Vision disabled - reasoning work does not need it. PARALLEL=1 because long
# reasoning chains contend heavily on the KV cache.

MODEL_NAME="Qwen3.8-27B-think"
MODEL_PATH="/var/lib/llama-cpp/models/Qwen3.8-27B-UD-Q4_K_XL.gguf"

# No vision in this profile
MMPROJ_PATH=""

HOST="0.0.0.0"
PORT="8090"

GPU_LAYERS="auto"
CTX_SIZE="262144"
BATCH_SIZE="8192"
UBATCH_SIZE="4096"
FLASH_ATTN="on"
THREADS="16"
PARALLEL="1"

# KV cache quantization
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"

# Sampling defaults (Unsloth thinking preset for Qwen3.8)
TEMP="1.0"
TOP_P="0.95"
MIN_P="0.0"
TOP_K="20"
REPEAT_PENALTY="1.0"

# Extra flags - reasoning on, traces exposed via deepseek format.
# presence_penalty 0 per the thinking preset (omitted = default 0).
EXTRA_FLAGS="--jinja --reasoning-format deepseek --reasoning on --chat-template-kwargs '{\"reasoning_effort\":\"medium\"}'"
