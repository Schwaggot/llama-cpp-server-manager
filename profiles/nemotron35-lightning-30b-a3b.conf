# Nemotron 3.5 Lightning 30B-A3B (Unsloth UD-Q4_K_XL) - 30B MoE, 3B active
# Docs: https://unsloth.ai/docs/models/nemotron-3.5
#
# NVIDIA's hybrid Mamba-2 + MoE + attention model, built for long-running
# agents and high-volume task execution. 30B total, 3B active. Text-only.
# ~23.8 GB at Q4 - fits on a 48 GB A40.
#
# This is the instruct (non-thinking) variant. For reasoning, use
# nemotron35-lightning-30b-a3b-think. For faster single-stream generation,
# use nemotron35-lightning-30b-a3b-mtp (same GGUF, MTP head enabled).

MODEL_NAME="Nemotron-3.5-Lightning-30B-A3B"
MODEL_PATH="/var/lib/llama-cpp/models/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-UD-Q4_K_XL.gguf"

# No vision
MMPROJ_PATH=""

HOST="0.0.0.0"
PORT="8090"

GPU_LAYERS="auto"
# The GGUF advertises 1M; NVIDIA serves 256K on a single 80 GB card.
CTX_SIZE="262144"
BATCH_SIZE="8192"
UBATCH_SIZE="4096"
FLASH_ATTN="on"
THREADS="16"
PARALLEL="2"

# KV cache quantization
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"

# Sampling defaults (Unsloth instruct preset). NVIDIA's model card instead
# recommends temp 1.0 / top_p 0.95 for both modes.
TEMP="0.2"
TOP_P="0.95"
MIN_P="0.01"
TOP_K="0"
REPEAT_PENALTY="1.0"

# Extra flags - thinking disabled for direct-answer / instruction work.
EXTRA_FLAGS="--jinja --chat-template-kwargs '{\"enable_thinking\":false}'"
