# Recursive Flint (Unsloth Q8_0) - agentic coding, reasoning model
# Docs: https://huggingface.co/RecursiveSI/flint
#
# 40B MoE, ~2.5B active (256 routed experts, top-6, plus a shared expert).
# 35 of 49 layers use a 513-token sliding window, so the KV cache stays small
# even at the full 262144 context. Text only, no vision projector.
#
# Q8_0 (42.3 GB) rather than Unsloth's default UD-Q4_K_XL: memory is not the
# constraint on this box, and with 2.5B active the near-lossless quant still
# runs fast. Benchmarked: UD-Q4_K_XL generates only ~11% faster (63.5 vs 57.3
# tok/s, 48.6 vs 44.9 at 32K depth) with the same prefill speed.
#
# Sampling is Recursive's recommended preset (temp 1.0, top_p 0.95, top_k 20).
# Reasoning comes back as reasoning_content; Recursive ask clients to keep it
# in the history and to allow at least 32768 output tokens on hard problems.
#
# REQUIRES a llama-server built from 2026-10-21 or later (flint, PR #30928).
# Check the library, not the binary:
#   strings /usr/local/lib/libllama.so.0 2>/dev/null | grep -cx flint

MODEL_NAME="Flint"
MODEL_PATH="/var/lib/llama-cpp/models/flint-Q8_0.gguf"

# Text only
MMPROJ_PATH=""

# Not "auto": at boot the amdgpu DRM node can appear after this service, and
# llama-server then falls back to CPU with only a warning.
REQUIRE_GPU="yes"

HOST="0.0.0.0"
PORT="8090"

GPU_LAYERS="99"
CTX_SIZE="262144"
# llama-bench sweep on halo (pp4096 / tg128, tok/s): ubatch 2048 gives the
# fastest prefill - 1668 vs 1429 at 1024 and 1571 at 4096 - and 703 at 32K
# depth. Generation is ~57 regardless. Flash attention off costs a third of
# generation speed at 32K depth and most of the prefill, so keep it on.
BATCH_SIZE="4096"
UBATCH_SIZE="2048"
FLASH_ATTN="on"
THREADS="16"
PARALLEL="1"

# KV cache quantization - f16 is affordable thanks to the sliding window
CACHE_TYPE_K="f16"
CACHE_TYPE_V="f16"

# Sampling defaults (Recursive's recommended preset)
TEMP="1.0"
TOP_P="0.95"
MIN_P="0.0"
TOP_K="20"
REPEAT_PENALTY="1.0"

# Extra flags - checkpoint chat template, reasoning traces exposed via the
# deepseek format so clients get reasoning_content. --cache-ram 0 per
# Recursive's README, to limit extra host-memory use; they also say to leave
# --swa-full unset.
EXTRA_FLAGS="--jinja --reasoning-format deepseek --cache-ram 0"
