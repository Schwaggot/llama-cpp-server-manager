# Qwen3.8-Flash-Next (Unsloth UD-Q4_K_XL) - 125B MoE, 6B active, + 51B n-gram
# Docs: https://unsloth.ai/docs/models/qwen3.8-next
#
# Experimental preview of Qwen's next architecture (qwen4exp). 48 layers, of
# which 36 are gated DeltaNet (linear) and 12 are Qwen Sparse Attention; 512
# micro-experts with 10 routed + 1 shared per token. Alongside the 125B main
# model sits a 51B per-layer-embedding (PLE) n-gram lookup table that is read
# by random access rather than multiplied - which is why it wants to live in
# host memory and page from disk, not sit in VRAM.
#
# Multimodal (image and video) with graded reasoning: the chat template takes
# reasoning_effort = xhigh (default) | medium | low | none.
#
# Best for: agentic coding, tool calling, long-context repository work.
#
# REQUIRES a llama-server built from 2026-08-27 or later - the qwen4exp
# architecture landed in PR #27742 and older builds cannot load the GGUF at
# all.
# Verify against the library, not the binary: a shared build leaves only a thin
# shim in /usr/local/bin, so the arch table is in libllama.so.
#   strings /usr/local/lib/libllama.so.0 /usr/local/bin/llama-server \
#     2>/dev/null | grep -c qwen4exp
#
# Reasoning is off here for text work; see qwen38-flash-next-think.

MODEL_NAME="Qwen3.8-Flash-Next"
# GGUF is split into 4 parts - point MODEL_PATH to part 1.
MODEL_PATH="/var/lib/llama-cpp/models/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf"

# Vision projector (multimodal support)
MMPROJ_PATH="/var/lib/llama-cpp/models/Qwen3.8-Flash-Next-mmproj-BF16.gguf"

HOST="0.0.0.0"
PORT="8090"

# Explicit, not "auto": the --fit sizer mis-measures this architecture (the PLE
# table dwarfs the layers it belongs to) and can fail to allocate. -cmoe in
# EXTRA_FLAGS decides what actually stays on the host, and -fit off keeps the
# sizer from second-guessing it.
GPU_LAYERS="99"
CTX_SIZE="262144"
# Smaller than the sibling profiles use. At 111 GB the model already sits near
# this box's memory ceiling, and compute buffers come out of the same pool.
BATCH_SIZE="4096"
UBATCH_SIZE="1024"
FLASH_ATTN="on"
THREADS="16"
PARALLEL="1"

# KV cache quantization. Cheap here either way - only 12 of 48 layers hold a KV
# cache, and those have 2 KV heads - so f16 is an easy upgrade if quality slips.
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"

# Sampling defaults (Unsloth instruct preset for Qwen3.8-Flash-Next)
TEMP="0.7"
TOP_P="0.8"
MIN_P="0.0"
TOP_K="20"
REPEAT_PENALTY="1.0"

# Extra flags - reasoning off for translation/summarization work.
# -cmoe keeps the experts and the PLE table in host memory; mmap (left on, as
# serve.sh never passes --no-mmap) is what makes the table pageable from disk.
# Trade host RAM for speed with -ncmoe N to pull the first N layers' experts
# back onto the GPU.
# --image-min-tokens 1024 follows llama.cpp's Qwen-VL guidance for grounding.
# If a future template drops reasoning_effort, '{"enable_thinking":false}' is
# the equivalent switch on the upstream Qwen card.
EXTRA_FLAGS="--jinja --presence-penalty 1.5 --chat-template-kwargs '{\"reasoning_effort\":\"none\"}' -cmoe -fit off --image-min-tokens 1024"
