# GLM-5.3-Flash (Unsloth UD-IQ3_XXS) - low reasoning effort
# Docs: https://unsloth.ai/docs/models/glm-5.3-flash
#
# Same weights and layout as glm-5.3-flash, with reasoning_effort at low.
#
# This is as close as the family gets to a non-thinking profile: the shipped
# chat template has no enable_thinking variable and unconditionally opens a
# <think> block on the generation prompt, so --reasoning-budget 0 and
# '{"enable_thinking":false}' have nothing to act on. reasoning_effort is the
# only lever, and it takes low | high | max - anything else falls back to max.
#
# Use this for chat, summarization and translation, where an 18B-active 320B
# model on unified memory is slow enough that the trace dominates wall-clock.
# For anything that needs to reason, use glm-5.3-flash (high) or the code
# sibling (max).
#
# REQUIRES a llama-server built from Unsloth's glm5next/upstream branch - see
# glm-5.3-flash for the build and the verification command.

MODEL_NAME="GLM-5.3-Flash-low"
# GGUF is split into 4 parts - point MODEL_PATH to part 1.
MODEL_PATH="/var/lib/llama-cpp/models/GLM-5.3-Flash-UD-IQ3_XXS-00001-of-00004.gguf"

# The MTP head ships inside the main GGUF - no separate draft file.
MODEL_DRAFT_PATH=""

# No vision in this profile
MMPROJ_PATH=""

HOST="0.0.0.0"
PORT="8090"

# Explicit, not "auto" - see glm-5.3-flash for the reasoning behind these.
GPU_LAYERS="99"
CTX_SIZE="262144"
BATCH_SIZE="2048"
UBATCH_SIZE="512"
FLASH_ATTN="on"
THREADS="16"
PARALLEL="1"

# KV cache unquantized - only 11 of 45 layers hold one.
CACHE_TYPE_K="f16"
CACHE_TYPE_V="f16"

# Sampling defaults (Unsloth preset for GLM-5.3-Flash). Only temperature and
# top_p are specified, so the other samplers are switched off rather than left
# at llama.cpp's defaults.
TEMP="1.0"
TOP_P="0.95"
MIN_P="0.0"
TOP_K="0"
REPEAT_PENALTY="1.0"

# Extra flags - reasoning at low effort, traces in deepseek format.
# Short traces still accumulate over a long session; add
# '{"clear_thinking":true}' to drop earlier ones from the history.
# -cmoe keeps the experts in host memory; see glm-5.3-flash for -ncmoe.
EXTRA_FLAGS="--jinja --reasoning-format deepseek --reasoning on --chat-template-kwargs '{\"reasoning_effort\":\"low\"}' --spec-type draft-mtp --spec-draft-n-max 2 -cmoe -fit off"
