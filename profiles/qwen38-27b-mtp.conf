# Qwen3.8 27B (Unsloth UD-Q4_K_XL) - MTP / speculative-decoding variant
# Docs: https://unsloth.ai/docs/models/mtp
#
# Same GGUF as qwen38-27b: the Multi-Token Prediction head ships inside it
# (block 64, tensors blk.64.nextn.*, qwen35.nextn_predict_layers=1), so there
# is nothing extra to download and no separate draft file - only
# --spec-type draft-mtp. This differs from Qwen3.6, whose MTP heads came from
# dedicated *-MTP-GGUF repos.
#
# Vision is off and PARALLEL is 1: llama.cpp does not yet support --mmproj or
# -np > 1 together with MTP. Use qwen38-27b for images or concurrent slots.
#
# REQUIRES a llama-server build that supports MTP speculative decoding.
# Verify with:  llama-server --help | grep -- --spec-type

MODEL_NAME="Qwen3.8-27B-MTP"
MODEL_PATH="/var/lib/llama-cpp/models/Qwen3.8-27B-UD-Q4_K_XL.gguf"

# MTP head is embedded in the model above - no separate draft file.
MODEL_DRAFT_PATH=""

# No vision - unsupported alongside MTP.
MMPROJ_PATH=""

HOST="0.0.0.0"
PORT="8090"

GPU_LAYERS="auto"
CTX_SIZE="262144"
BATCH_SIZE="8192"
UBATCH_SIZE="4096"
FLASH_ATTN="on"
THREADS="16"
# Speculative decoding is single-stream oriented; keep parallel at 1.
PARALLEL="1"

# KV cache quantization
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"

# Sampling defaults (Unsloth instruct preset for Qwen3.8)
TEMP="0.7"
TOP_P="0.8"
MIN_P="0.0"
TOP_K="20"
REPEAT_PENALTY="1.0"

# Extra flags - reasoning off, plus MTP speculative decoding. Raise
# reasoning_effort for coding and analysis; MTP still applies, but acceptance
# drops on high-entropy reasoning traces.
# --spec-draft-n-max: tokens drafted per step (start at 2; test 1-6).
EXTRA_FLAGS="--jinja --presence-penalty 1.5 --chat-template-kwargs '{\"reasoning_effort\":\"none\"}' --spec-type draft-mtp --spec-draft-n-max 2"
