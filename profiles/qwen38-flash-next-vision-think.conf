# Qwen3.8-Flash-Next (Unsloth UD-Q4_K_XL) - vision + reasoning
# Docs: https://unsloth.ai/docs/models/qwen3.8-next
#
# qwen38-flash-next-think plus the vision projector. The model takes images and
# video through the stock Qwen3-VL ViT, so only the mmproj is an extra file.
#
# --mmproj disables context shift and cache reuse; at 256K that rarely bites,
# but a session past the window ends rather than sliding.
#
# --image-min-tokens 1024 follows llama.cpp's own startup warning for Qwen-VL:
# below that, grounding tasks lose accuracy. Drop it to trade accuracy for
# fewer prompt tokens per image.
#
# No MTP sibling for this family yet: multi-token prediction for qwen4exp was
# still work in progress when the architecture was merged upstream.
#
# REQUIRES a llama-server built from 2026-08-27 or later (qwen4exp support).
# Verify against the library, not the binary: a shared build leaves only a thin
# shim in /usr/local/bin, so the arch table is in libllama.so.
#   strings /usr/local/lib/libllama.so.0 /usr/local/bin/llama-server \
#     2>/dev/null | grep -c qwen4exp

MODEL_NAME="Qwen3.8-Flash-Next-vision-think"
# GGUF is split into 4 parts - point MODEL_PATH to part 1.
MODEL_PATH="/var/lib/llama-cpp/models/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf"

# Vision projector (multimodal support)
MMPROJ_PATH="/var/lib/llama-cpp/models/Qwen3.8-Flash-Next-mmproj-BF16.gguf"

HOST="0.0.0.0"
PORT="8090"

# Explicit, not "auto" - the --fit sizer mis-measures this architecture.
# See qwen38-flash-next for the reasoning behind these three lines.
GPU_LAYERS="99"
CTX_SIZE="262144"
BATCH_SIZE="4096"
UBATCH_SIZE="1024"
FLASH_ATTN="on"
THREADS="16"
PARALLEL="1"

# KV cache quantization
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"

# Sampling defaults (Unsloth thinking preset for Qwen3.8-Flash-Next)
TEMP="1.0"
TOP_P="0.95"
MIN_P="0.0"
TOP_K="20"
REPEAT_PENALTY="1.0"

# Extra flags - reasoning on at medium effort, traces in deepseek format.
# -cmoe keeps the experts and the PLE table in host memory; see the base
# profile for the -ncmoe tuning lever.
EXTRA_FLAGS="--jinja --reasoning-format deepseek --reasoning on --chat-template-kwargs '{\"reasoning_effort\":\"medium\"}' -cmoe -fit off --image-min-tokens 1024"
