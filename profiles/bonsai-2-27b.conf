# Ternary Bonsai 2 27B (PrismML Q2_0) - vision + reasoning, second instance
# Docs: https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf
#
# Ternary (g128, Hadamard-rotated) quantization of Qwen3.8-27B; GGUF arch is
# qwen35. Meant to run beside the main instance via llama-cpp@bonsai-2-27b,
# so it listens on 8091 and is sized for the VRAM the main profile leaves.
#
# REQUIRES llama.cpp b11556 or newer. Older builds load Q2_0 without a warning
# and produce garbage, so the profile pins its own binary instead of the
# shared /usr/local/bin/llama-server. PQ2_0 and PTQ1_0 need PrismML's fork.
#
# reasoning_effort takes low | medium | xhigh; "high" returns HTTP 500 and
# "low" behaves close to xhigh. A client disables thinking per request with
# reasoning_effort "none", which works only because --reasoning stays auto.
#
# Avoid q5_0 KV, which upstream reports as several times slower. No MTP head
# ships for this model, and ngram speculation has no effect on it.

MODEL_NAME="Ternary-Bonsai-2-27B"
MODEL_PATH="/var/lib/llama-cpp/models/Ternary-Bonsai-2-27B-Q2_0.gguf"
MMPROJ_PATH="/var/lib/llama-cpp/models/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf"

LLAMA_SERVER="/opt/llama.cpp/b11998/llama-server"

HOST="127.0.0.1"
PORT="8091"

# Explicit layers and -fit off: fail loudly rather than shrink to fit.
GPU_LAYERS="99"
CTX_SIZE="65536"
BATCH_SIZE="2048"
UBATCH_SIZE="1024"
FLASH_ATTN="on"
THREADS="16"
PARALLEL="1"
REQUIRE_GPU="yes"

CACHE_TYPE_K="q8_0"
CACHE_TYPE_V="q8_0"

# Thinking preset from the model card.
TEMP="1.0"
TOP_P="0.95"
MIN_P="0.05"
TOP_K="20"
REPEAT_PENALTY="1.0"

EXTRA_FLAGS="-fit off --jinja --reasoning-format deepseek --chat-template-kwargs '{\"reasoning_effort\":\"medium\"}' --image-min-tokens 1024"
