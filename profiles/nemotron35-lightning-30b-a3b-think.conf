# Nemotron 3.5 Lightning 30B-A3B (Unsloth UD-Q4_K_XL) - reasoning / tool-calling
# Docs: https://unsloth.ai/docs/models/nemotron-3.5
#
# Reasoning-enabled variant (the model's default mode). Generates
# <think>...</think> traces before the answer, exposed via the deepseek
# format so clients can render them separately.
#
# PARALLEL=1 - long reasoning chains contend heavily on the KV cache.
# For direct answers, use nemotron35-lightning-30b-a3b instead.

MODEL_NAME="Nemotron-3.5-Lightning-30B-A3B-think"
MODEL_PATH="/var/lib/llama-cpp/models/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-UD-Q4_K_XL.gguf"

# No vision
MMPROJ_PATH=""

HOST="0.0.0.0"
PORT="8090"

GPU_LAYERS="auto"
# The GGUF advertises 1M; NVIDIA serves 256K on a single 80 GB card.
CTX_SIZE="262144"
BATCH_SIZE="8192"
UBATCH_SIZE="4096"
FLASH_ATTN="on"
THREADS="16"
PARALLEL="1"

# KV cache quantization
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"

# Sampling defaults (Unsloth thinking preset). NVIDIA's model card instead
# recommends temp 1.0 / top_p 0.95 for both modes.
TEMP="0.6"
TOP_P="0.95"
MIN_P="0.01"
TOP_K="0"
REPEAT_PENALTY="1.0"

# Extra flags - thinking on, reasoning traces exposed via deepseek format.
EXTRA_FLAGS="--jinja --reasoning-format deepseek --reasoning on --chat-template-kwargs '{\"enable_thinking\":true}'"
