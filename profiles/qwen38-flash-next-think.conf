# Qwen3.8-Flash-Next (Unsloth UD-Q4_K_XL) - reasoning enabled
# Docs: https://unsloth.ai/docs/models/qwen3.8-next
#
# Same weights as qwen38-flash-next, with reasoning on and Unsloth's thinking
# preset (temp 1.0, top_p 0.95, presence_penalty 0). Traces are exposed in the
# deepseek format so clients can render them separately from the answer.
#
# This model thinks by default upstream, and its template supports preserved
# thinking: earlier reasoning blocks stay in the history instead of being
# stripped, which keeps a multi-turn agent's decision trace intact and its KV
# cache warm. That is left at the template default here; override with
# --reasoning-preserve / --no-reasoning-preserve if a client disagrees.
#
# reasoning_effort is medium here, the accuracy/speed balance for coding; raise
# it to xhigh (the model default) for complex analysis. Do not starve it - Qwen
# report that throttling the budget on multi-step tasks produces sloppy
# assumptions and repeated tool failures that cost more than they save.
#
# Vision disabled - reasoning work does not need it. See the vision sibling.
#
# REQUIRES a llama-server built from 2026-08-27 or later (qwen4exp support).
# Verify against the library, not the binary: a shared build leaves only a thin
# shim in /usr/local/bin, so the arch table is in libllama.so.
#   strings /usr/local/lib/libllama.so.0 /usr/local/bin/llama-server \
#     2>/dev/null | grep -c qwen4exp

MODEL_NAME="Qwen3.8-Flash-Next-think"
# GGUF is split into 4 parts - point MODEL_PATH to part 1.
MODEL_PATH="/var/lib/llama-cpp/models/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf"

# No vision in this profile
MMPROJ_PATH=""

HOST="0.0.0.0"
PORT="8090"

# Explicit, not "auto" - the --fit sizer mis-measures this architecture.
# See qwen38-flash-next for the reasoning behind these three lines.
GPU_LAYERS="99"
CTX_SIZE="262144"
BATCH_SIZE="4096"
UBATCH_SIZE="1024"
FLASH_ATTN="on"
THREADS="16"
PARALLEL="1"

# KV cache quantization
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"

# Sampling defaults (Unsloth thinking preset for Qwen3.8-Flash-Next)
TEMP="1.0"
TOP_P="0.95"
MIN_P="0.0"
TOP_K="20"
REPEAT_PENALTY="1.0"

# Extra flags - reasoning on at medium effort, traces exposed via deepseek
# format. presence_penalty 0 per the thinking preset (omitted = default 0).
# -cmoe keeps the experts and the PLE table in host memory; see the base
# profile for the -ncmoe tuning lever.
EXTRA_FLAGS="--jinja --reasoning-format deepseek --reasoning on --chat-template-kwargs '{\"reasoning_effort\":\"medium\"}' -cmoe -fit off"
