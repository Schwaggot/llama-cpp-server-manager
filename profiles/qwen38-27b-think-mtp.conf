# Qwen3.8 27B (Unsloth UD-Q4_K_XL) - reasoning + MTP variant
# Docs: https://unsloth.ai/docs/models/mtp
#
# qwen38-27b-think plus MTP speculative decoding. Same GGUF as every qwen38
# profile: the MTP head ships inside it (block 64, tensors blk.64.nextn.*), so
# there is nothing extra to download and no separate draft file.
#
# This is where MTP earns the most wall-clock: reasoning traces are long and
# single-stream. Acceptance is lower than in the instruct profile, though -
# temp 1.0 / top_p 0.95 makes the token stream less predictable - so sweep
# --spec-draft-n-max here separately from qwen38-27b-mtp.
#
# REQUIRES a llama-server build that supports MTP speculative decoding.
# Verify with:  llama-server --help | grep -- --spec-type

MODEL_NAME="Qwen3.8-27B-think-MTP"
MODEL_PATH="/var/lib/llama-cpp/models/Qwen3.8-27B-UD-Q4_K_XL.gguf"

# MTP head is embedded in the model above - no separate draft file.
MODEL_DRAFT_PATH=""

# No vision - unsupported alongside MTP, and reasoning work does not need it.
MMPROJ_PATH=""

HOST="0.0.0.0"
PORT="8090"

GPU_LAYERS="auto"
CTX_SIZE="262144"
BATCH_SIZE="8192"
UBATCH_SIZE="4096"
FLASH_ATTN="on"
THREADS="16"
# Speculative decoding is single-stream oriented; keep parallel at 1.
PARALLEL="1"

# KV cache quantization
CACHE_TYPE_K="q4_0"
CACHE_TYPE_V="q4_0"

# Sampling defaults (Unsloth thinking preset for Qwen3.8)
TEMP="1.0"
TOP_P="0.95"
MIN_P="0.0"
TOP_K="20"
REPEAT_PENALTY="1.0"

# Extra flags - reasoning on at medium effort, traces in deepseek format,
# plus MTP speculative decoding.
# --spec-draft-n-max: tokens drafted per step (start at 2; test 1-6).
EXTRA_FLAGS="--jinja --reasoning-format deepseek --reasoning on --chat-template-kwargs '{\"reasoning_effort\":\"medium\"}' --spec-type draft-mtp --spec-draft-n-max 2"
